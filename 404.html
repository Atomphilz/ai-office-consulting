<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seite nicht gefunden – Philipp Konrad</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0e1012" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f6f3" media="(prefers-color-scheme: light)">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<style>
:root { color-scheme: dark; --bg:#0e1012; --surface:#15181b; --text:#e8e8e4; --muted:#a4a8ac; --accent:#9ccfbf; --accent-ink:#0b1512; --rule:#272b30; }
@media (prefers-color-scheme: light) { :root { color-scheme: light; --bg:#f6f6f3; --surface:#fff; --text:#17191b; --muted:#5b6168; --accent:#1f6b5a; --accent-ink:#fff; --rule:#e2e2dc; } }
* { box-sizing: border-box; }
body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Helvetica,Arial,sans-serif; font-size:1.0625rem; line-height:1.6; -webkit-font-smoothing:antialiased; padding:16px; }
main { max-width:34rem; text-align:center; }
.code { font-size:4rem; font-weight:700; letter-spacing:-0.03em; color:var(--accent); line-height:1; margin:0 0 12px; }
h1 { font-size:1.6rem; margin:0 0 12px; letter-spacing:-0.015em; }
p { color:var(--muted); margin:0 0 28px; }
.btn { display:inline-flex; align-items:center; min-height:48px; padding:12px 22px; border-radius:10px; background:var(--accent); color:var(--accent-ink); font-weight:600; text-decoration:none; }
.btn:focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
</style>
</head>
<body>
<main>
  <p class="code" aria-hidden="true">404</p>
  <h1>Diese Seite gibt es nicht.</h1>
  <p>Die Adresse ist vermutlich unvollständig oder veraltet. Die Startseite finden Sie hier:</p>
  <a class="btn" href="/">Zur Startseite</a>
</main>
</body>
</html>
